<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Arcane Clash</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #050816;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Phaser 4 -->
  <script src="phaser.js"></script>
  <!-- PeerJS — peer-to-peer multiplayer -->
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

  <!-- Core config (load first — all other files depend on GAME_CONFIG) -->
  <script src="src/GameConfig.js"></script>

  <!-- Systems -->
  <script src="src/systems/InputManager.js"></script>
  <script src="src/systems/PhysicsSystem.js"></script>
  <script src="src/systems/AnimationManager.js"></script>
  <script src="src/systems/CharacterRenderer.js"></script>
  <script src="src/systems/SpriteAnimator.js"></script>

  <!-- UI -->
  <script src="src/ui/HUD.js"></script>

  <!-- Characters (BaseCharacter first, then subclasses) -->
  <script src="src/characters/BaseCharacter.js"></script>
  <script src="src/characters/Naruto.js"></script>
  <script src="src/characters/Goku.js"></script>
  <script src="src/characters/Ichigo.js"></script>
  <script src="src/characters/Luffy.js"></script>
  <script src="src/characters/Tanjiro.js"></script>
  <script src="src/characters/Warrior.js"></script>

  <!-- Combat (after characters so it can reference them) -->
  <script src="src/systems/CombatSystem.js"></script>
  <script src="src/systems/BotController.js"></script>
  <script src="src/systems/NetworkManager.js"></script>

  <!-- Scenes -->
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/UIScene.js"></script>
  <script src="src/scenes/GameScene.js"></script>

  <!-- Entry point -->
  <script src="src/game.js"></script>
</body>
</html>
